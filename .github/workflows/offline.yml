name: Offline validation
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - run: python -m pip install -r requirements-host.txt
      - run: python camera_app/fetch_models.py
      - run: python -m compileall -q camera_app airlink tools tests
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
